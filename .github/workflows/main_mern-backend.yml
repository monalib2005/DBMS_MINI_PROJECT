name: Build and deploy Node.js app to Azure Web App - mern-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ✅ FIX: point to backend folder
      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Build (if any)
        working-directory: backend
        run: npm run build --if-present

      - name: Test (if any)
        working-directory: backend
        run: npm run test --if-present

      # ✅ Upload ONLY backend
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2C696C669CE848C98DA63BAF8FF19C7C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A5D3B9AD8F3D43538C2270D069044DC3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2C1FF50F493544698523633A472291A6 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mern-backend'
          slot-name: 'Production'
          package: .
